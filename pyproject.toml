[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "io-drift-reduction"
version = "0.1.0"
description = "Reproducible IMU-only drone velocity learning and drift evaluation on EuRoC"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2", "scipy>=1.10", "scikit-learn>=1.3", "torch>=2.2", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]
